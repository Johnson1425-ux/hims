# Local development stack.
#
# `docker compose up -d` brings up ONLY what the application needs to run:
# PostgreSQL and Redis. Object storage and the mail catcher sit behind the
# `extras` profile:
#
#   docker compose -f infra/docker-compose.yml up -d                    # db + redis
#   docker compose -f infra/docker-compose.yml --profile extras up -d   # everything
#
# The split is not tidiness. MinIO was pulled from Docker Hub, and with every
# service in the default set a registry change in an optional dev dependency
# stopped the database from starting at all. Nothing optional should be able to
# block the thing the application actually depends on.
#
# This file provides a BARE PostgreSQL with the stock `postgres` superuser, and
# nothing else. The application's roles and database are created by
# `pnpm db:create`.
#
# That split is deliberate, for two reasons:
#
#  1. ONE mechanism, not two. Creating roles here as well as in db:create means
#     two definitions that drift. db:create works against this container and
#     against a natively installed PostgreSQL identically, so it is the single
#     source of truth.
#
#  2. `POSTGRES_USER` is the container's SUPERUSER. Setting it to hims_owner —
#     as an earlier version of this file did — makes the schema owner a
#     superuser, and a superuser bypasses row-level security entirely. The
#     privilege separation would have looked correct while being inert, and the
#     isolation tests would have passed against a system that leaked. The
#     bootstrap superuser stays `postgres`; hims_owner is created as an
#     ordinary role that owns the `hims` database and nothing more.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hims-postgres
    environment:
      # The bootstrap superuser, and only that. `pnpm db:create` connects with
      # these credentials to create hims_owner, hims_app, hims_platform,
      # hims_analytics and the `hims` database itself.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Deterministic collation, so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu'
    ports:
      # Overridable because a locally installed PostgreSQL often already holds
      # 5432 — on Windows and macOS the installer registers a service that
      # starts at boot. `POSTGRES_PORT=5433 docker compose up -d` moves this
      # one aside; remember to match it in the DATABASE_* URLs in .env.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - postgres
      # Development conveniences; tune for the real workload in production.
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    container_name: hims-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for documents, scans and signatures.
  #
  # NOTE: `minio/minio` is no longer published on Docker Hub — a pull of
  # `minio/minio:latest` fails with "pull access denied ... repository does not
  # exist". MinIO publishes to its own registry (quay.io) instead. Override
  # MINIO_IMAGE in .env if you need a specific dated RELEASE tag, or point it at
  # any S3-compatible server you prefer.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    profiles: ['extras']
    container_name: hims-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hims-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hims-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outbound mail in development, so a test reminder can never reach a
  # real patient. The notification worker also refuses to send without an
  # explicitly configured provider.
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ['extras']
    container_name: hims-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  minio-data:
